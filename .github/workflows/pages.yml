# Copy to .github/workflows/pages.yml in the website-only public repository.
# Approved aggregate data is injected into the artifact, never committed.
name: Publish CEO dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare website with the approved aggregate snapshot
        env:
          CEO_OBSERVATIONS_JSON: ${{ secrets.CEO_OBSERVATIONS_JSON }}
        run: |
          mkdir _site
          cp index.html observations.js .nojekyll _site/
          if [ -n "$CEO_OBSERVATIONS_JSON" ]; then
            printf '%s' "$CEO_OBSERVATIONS_JSON" > _site/ceo-data.json
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
